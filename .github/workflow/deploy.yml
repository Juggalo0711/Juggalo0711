name: Deploy Vite App to GitHub Pages

# 1. Trigger the workflow on push to main
on:
  push:
    branches: ["main"] 
  workflow_dispatch: 

# 2. Grant permissions to GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 3. Prevent multiple simultaneous deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

# 4. Define the build and deploy job
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # You can change this to match your local Node version
          cache: 'npm'     # Speeds up builds by caching dependencies

      - name: Install dependencies
        run: npm ci        # 'npm ci' is strictly better for CI/CD environments than 'npm install'

      - name: Build project
        run: npm run build # Compiles your Vite app

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite outputs the compiled site to the 'dist' folder by default
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
